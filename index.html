y": 7, "category": "读题句型", "en": "Which structure passes through the intervertebral foramen?", "zh": "什么结构通过椎间孔？", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-11", "week": 1, "day": 7, "category": "读题句型", "en": "The foramen magnum is in the occipital bone.", "zh": "枕骨大孔位于枕骨。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-12", "week": 1, "day": 7, "category": "读题句型", "en": "Which bone forms the lower jaw?", "zh": "哪块骨构成下颌？", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-13", "week": 1, "day": 7, "category": "读题句型", "en": "the head of the left femur", "zh": "左股骨头。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-14", "week": 1, "day": 7, "category": "读题句型", "en": "the distal end of the radius", "zh": "桡骨远端。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-15", "week": 1, "day": 7, "category": "读题句型", "en": "Which of the following bones is NOT a tarsal bone?", "zh": "下列哪块骨不是跗骨？", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-16", "week": 1, "day": 7, "category": "读题句型", "en": "The ulna is medial to the radius.", "zh": "尺骨位于桡骨的内侧。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-17", "week": 1, "day": 7, "category": "读题句型", "en": "The foramen magnum is located in the occipital bone.", "zh": "枕骨大孔位于枕骨。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-18", "week": 1, "day": 7, "category": "读题句型", "en": "The humerus articulates with the scapula.", "zh": "肱骨与肩胛骨相关节。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-19", "week": 1, "day": 7, "category": "读题句型", "en": "The radius articulates with the humerus.", "zh": "桡骨与肱骨相关节。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-20", "week": 1, "day": 7, "category": "读题句型", "en": "The patella is located anterior to the knee joint.", "zh": "髌骨位于膝关节的前方。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-21", "week": 1, "day": 7, "category": "读题句型", "en": "Which of the following bones is NOT part of the hip bone?", "zh": "下列哪块骨不是髋骨的一部分？", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-22", "week": 1, "day": 7, "category": "读题句型", "en": "the proximal end of the right humerus", "zh": "右肱骨近端。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-23", "week": 1, "day": 7, "category": "读题句型", "en": "The coccyx is inferior to the sacrum.", "zh": "尾骨位于骶骨的下方。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}, {"id": "w1-p-24", "week": 1, "day": 7, "category": "读题句型", "en": "the spinous process of a cervical vertebra", "zh": "一块颈椎的棘突。", "note": "只判断英文题意，不要求解答解剖知识", "type": "phrase"}];
const KEY='anatomy_english_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};
state.extra=state.extra||[];state.progress=state.progress||{};state.logs=state.logs||[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>[...SEED,...state.extra];function save(){localStorage.setItem(KEY,JSON.stringify(state))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let tab='home',queue=[],idx=0,revealed=false,mode='card',filter='all',selected=null;
const tabs=[['home','学习首页'],['card','认词卡片'],['quiz','选择自测'],['reading','读题训练'],['review','错题复习'],['data','数据管理']];
function nav(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
$('tabs').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" onclick="nav('${k}')">${v}</button>`).join('');
function score(id,ok){let p=state.progress[id]||{right:0,wrong:0,streak:0};if(ok){p.right++;p.streak++}else{p.wrong++;p.streak=0}p.last=Date.now();p.next=Date.now()+(ok?(p.streak>=3?7:p.streak===2?3:1):0)*86400000;state.progress[id]=p;state.logs.push({id,ok,time:Date.now()});save()}
function summary(){let p=Object.values(state.progress);return `<div class="stats"><div class="stat"><span class="muted tiny">总题库</span><strong>${all().length}</strong><span class="tiny muted">词汇与句型</span></div><div class="stat"><span class="muted tiny">已练习</span><strong>${p.length}</strong><span class="tiny muted">个知识点</span></div><div class="stat"><span class="muted tiny">待巩固</span><strong>${p.filter(x=>x.wrong&&x.streak<3).length}</strong><span class="tiny muted">个知识点</span></div></div>`}
function home(){let a=all();return `${summary()}<div class="panel" style="margin-top:16px"><h2>第一周 · 10月31日—11月7日</h2><p class="muted">前 6 天每天 12 个术语；第 7 天读题表达；第 8 天综合自测。每天 20–30 分钟。</p><div class="grid">${['方位词','结构通用词','上肢骨','下肢骨','躯干骨与椎骨','颅骨','题干表达','综合复习'].map((name,i)=>{let n=a.filter(x=>x.week===1&&x.day===i+1).length;return `<button class="day" onclick="start('card','day:${i+1}')"><b>第 ${i+1} 天 · ${esc(name)}</b><small>${i===7?'综合回顾':n+' 条可练习'}</small></button>`}).join('')}</div></div><div class="panel"><h2>建议学习顺序</h2><p>① 先复习昨天错词 → ② 认今天的英文术语 → ③ 读英文题干 → ④ 做选择自测。</p><p class="muted">按讲义要求，只练英文识别与英译中；读不懂英文和不会解剖知识应分别记录。</p><button class="btn primary" onclick="start('card','due')">开始今日复习</button><button class="btn" onclick="start('quiz','all')">随机自测</button></div>`}
function candidates(f,type){let a=all().filter(x=>type==='reading'?x.type==='phrase':type==='quiz'?x.type==='term':true);if(f.startsWith('day:')){let d=Number(f.split(':')[1]);if(d<8)a=a.filter(x=>x.week===1&&x.day===d)}if(f==='due'){let due=a.filter(x=>!state.progress[x.id]||state.progress[x.id].next<=Date.now());a=due.length?due:a}if(f==='wrong')a=a.filter(x=>state.progress[x.id]?.wrong&&state.progress[x.id]?.streak<3);return shuffle(a)}
function start(m,f){mode=m;filter=f;queue=candidates(f,m);idx=0;revealed=false;selected=null;tab=m==='quiz'?'quiz':m==='reading'?'reading':m==='review'?'review':'card';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function action(ok){let x=queue[idx];if(!x)return;score(x.id,ok);idx++;revealed=false;selected=null;render()}
function question(){if(!queue.length)return `<div class="panel"><h2>暂时没有符合条件的题目</h2><button class="btn" onclick="start('${mode}','all')">练习全部</button></div>`;if(idx>=queue.length)return `<div class="panel"><h2>本轮完成 🎉</h2><p>本轮已练习 ${queue.length} 条。学习记录已保存。</p><button class="btn primary" onclick="start('${mode}', '${filter}')">再练一轮</button><button class="btn" onclick="nav('home')">返回首页</button></div>`;let x=queue[idx],p=Math.round(idx/queue.length*100);let html=`<div class="panel"><div class="flex space"><span class="pill">${esc(x.category)} · 第 ${x.week} 周</span><span class="muted tiny">${idx+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0"><div style="width:${p}%"></div></div><div class="muted">${mode==='quiz'?'选择最准确的中文意思':'先在心里说出中文，再查看答案'}</div><div class="term">${esc(x.en)}</div>`;
if(mode==='quiz'){let pool=shuffle(all().filter(y=>y.type==='term'&&y.id!==x.id&&y.zh!==x.zh));let opts=shuffle([x,...pool.slice(0,3)]);html+=opts.map(y=>`<button class="option ${revealed?(y.id===x.id?'good':selected===y.id?'bad':''):''}" ${revealed?'disabled':''} onclick="choose('${esc(y.id)}')">${esc(y.zh)}</button>`).join('');if(revealed)html+=`<div class="notice">正确答案：${esc(x.zh)}<br>${esc(x.note)}</div><button class="btn primary" onclick="nextQuiz()">下一题</button>`}else{if(revealed)html+=`<div class="answer">${esc(x.zh)}</div><p class="muted">${esc(x.note)}</p><button class="btn" onclick="action(false)">没记住 · 再复习</button><button class="btn primary" onclick="action(true)">记住了 · 下一题</button>`;else html+=`<button class="btn primary" onclick="revealed=true;render()">显示中文答案</button><button class="btn" onclick="action(false)">不会，直接跳过</button>`}return html+`</div><div class="muted tiny">记忆评分是自评；读题训练请核对否定词、方位词及限定条件。</div>`}
function choose(id){if(revealed)return;selected=id;revealed=true;render()}
function nextQuiz(){score(queue[idx].id,selected===queue[idx].id);idx++;revealed=false;selected=null;render()}
function controls(m){return `<div class="panel"><div class="flex space"><h2>${m==='quiz'?'术语选择自测':m==='reading'?'英文题干理解':'英文认词卡片'}</h2><select id="filter" onchange="start('${m}',this.value)"><option value="all" ${filter==='all'?'selected':''}>全部随机</option><option value="due" ${filter==='due'?'selected':''}>今日待复习</option>${[1,2,3,4,5,6,7].map(i=>`<option value="day:${i}" ${filter==='day:'+i?'selected':''}>第 ${i} 天</option>`).join('')}</select></div></div>`}
function review(){let weak=all().filter(x=>state.progress[x.id]?.wrong&&state.progress[x.id]?.streak<3);return `${summary()}<div class="panel" style="margin-top:15px"><h2>错题与薄弱项</h2><p class="muted">错题连续答对 3 次后从薄弱列表移出；记录保留。</p><button class="btn primary" onclick="start('card','wrong')">复习薄弱项 (${weak.length})</button>${weak.slice(0,40).map(x=>`<div class="flex space" style="border-bottom:1px solid #304058;padding:10px 0"><b>${esc(x.en)}</b><span class="muted">${esc(x.zh)}</span></div>`).join('')}</div>`}
function download(name,content){let b=new Blob([content],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBackup(){download('系解学习记录备份.json',JSON.stringify({format:'anatomy-study-backup-v1',...state},null,2))}
function exportTemplate(){download('每周题库导入模板.json',JSON.stringify({week:2,items:[{en:'example term',zh:'示例中文',category:'新周术语',note:'记忆提示',day:1,type:'term'},{en:'Which structure ...?',zh:'什么结构……？',category:'英文题干',note:'注意问法',day:7,type:'phrase'}]},null,2))}
async function importFile(el,backup){let f=el.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(backup){if(obj.format!=='anatomy-study-backup-v1')throw Error('不是有效的学习记录备份');state={extra:obj.extra||[],progress:obj.progress||{},logs:obj.logs||[]};save();alert('学习记录恢复成功');render();return}let rows=Array.isArray(obj)?obj:obj.items,week=Number(obj.week||2);if(!Array.isArray(rows)||!rows.length)throw Error('未找到 items 数组');let count=0;for(let i=0;i<rows.length;i++){let r=rows[i];if(!r.en||!r.zh)continue;let id=r.id||`w${week}-${r.en.toLowerCase().trim().replace(/\s+/g,'-')}`;if(all().some(x=>x.id===id||x.en.toLowerCase().trim()===r.en.toLowerCase().trim()))continue;state.extra.push({id,week:Number(r.week||week),day:Number(r.day||1),category:r.category||`第${week}周`,en:r.en,zh:r.zh,note:r.note||'',type:r.type==='phrase'?'phrase':'term'});count++}save();alert(`成功新增 ${count} 条；原有进度未清除`);render()}catch(e){alert('导入失败：'+e.message)}el.value=''}
function data(){return `<div class="panel"><h2>每周更新题库</h2><p>下载 JSON 模板，将新一周的英文术语、中文释义和句型填进去，再导入。程序会跳过重复英文，不覆盖已有学习记录。</p><button class="btn" onclick="exportTemplate()">下载题库模板</button><p><input type="file" accept=".json,application/json" onchange="importFile(this,false)"></p><div class="notice">当前离线版直接支持 JSON。Word 文件可以每周交给 ChatGPT 转换成此模板后导入；浏览器本身不自动解析 Word。</div></div><div class="panel"><h2>学习数据备份</h2><p class="muted">浏览器本地保存；请定期导出备份，尤其是更换设备之前。</p><button class="btn primary" onclick="exportBackup()">导出完整备份</button><p><input type="file" accept=".json,application/json" onchange="importFile(this,true)"></p></div><div class="panel"><h2>题库信息</h2><p>内置第一周 72 个核心术语、8 个读题表达及 24 条讲义句型练习；外部新增 ${state.extra.length} 条。</p><p class="muted">第 8 天综合自测可使用随机选择题和句型练习。讲义原版的 20+8 分正式卷仍以原文为准。</p></div>`}
function render(){if(tab==='home')$('view').innerHTML=home();else if(tab==='review'&&mode!=='card')$('view').innerHTML=review();else if(tab==='review')$('view').innerHTML=review();else if(tab==='data')$('view').innerHTML=data();else{if(!queue.length||mode!==tab){mode=tab;queue=candidates('all',mode);idx=0;revealed=false;selected=null;filter='all'}$('view').innerHTML=controls(mode)+question()}}
nav('home');
</script></body></html>
