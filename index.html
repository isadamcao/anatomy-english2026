const tabs=[['home','学习首页'],['card','认词卡片'],['quiz','选择自测'],['reading','读题训练'],['review','错题复习'],['data','数据管理']];
function nav(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
$('tabs').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" onclick="nav('${k}')">${v}</button>`).join('');
function score(id,ok){let p=state.progress[id]||{right:0,wrong:0,streak:0};if(ok){p.right++;p.streak++}else{p.wrong++;p.streak=0}p.last=Date.now();p.next=Date.now()+(ok?(p.streak>=3?7:p.streak===2?3:1):0)*86400000;state.progress[id]=p;state.logs.push({id,ok,time:Date.now()});save()}
function summary(){const a=all(),pr=a.filter(x=>state.progress[x.id]),weak=a.filter(x=>state.progress[x.id]?.wrong&&state.progress[x.id].streak<3);return `<div class="stats"><div class="stat"><span class="muted tiny">当前范围题库</span><strong>${a.length}</strong><span class="tiny muted">含通用词及新周内容</span></div><div class="stat"><span class="muted tiny">范围内已练习</span><strong>${pr.length}</strong><span class="tiny muted">旧记录继续保留</span></div><div class="stat"><span class="muted tiny">范围内待巩固</span><strong>${weak.length}</strong><span class="tiny muted">个知识点</span></div></div>`}
function home(){const m=meta(selectedWeek),a=all();return `${summary()}<div class="panel" style="margin-top:16px"><h2>复习范围已调整</h2><p>运动系统不再单列复习，保留神经相关肌肉。内脏学、腹膜、脉管、神经与内分泌继续复习。</p><p class="muted">骨学词汇退出默认训练；方位和通用词继续保留。神经相关肌肉随支配、功能与损伤题分批补充。</p></div><div class="panel"><div class="flex space"><h2>第 ${selectedWeek} 周 · ${esc(m.title)}</h2><select aria-label="选择学习周" onchange="selectedWeek=Number(this.value);render()">${weeks().map(w=>`<option value="${w}" ${w===selectedWeek?'selected':''}>第${w}周</option>`).join('')}</select></div><p class="muted">${m.startDate?`${m.startDate} 至 ${m.endDate} · `:''}每天20–30分钟；先复习旧词，再认新词，最后读两条题干。</p><div class="grid">${m.days.map(d=>{const r=a.filter(x=>x.week===selectedWeek&&x.day===d.day),f=`week:${selectedWeek}:day:${d.day}`;return `<div class="day"><b>${esc(d.date||'第'+d.day+'天')} · ${esc(d.title)}</b><small>${r.filter(x=>x.type==='term').length} 个术语 · ${r.filter(x=>x.type==='phrase').length} 条句型${d.date===localDate()?' · 今天':''}</small><button class="btn primary" onclick="start('card','${f}')">认词</button><button class="btn" onclick="start('reading','${f}')">读题</button>${d.review?`<small>${esc(d.review)}</small>`:''}</div>`}).join('')}</div></div><div class="panel"><h2>开始练习</h2><button class="btn primary" onclick="start('card','today')">今天的新词与到期复习</button><button class="btn" onclick="start('quiz','week:${selectedWeek}')">本周选择自测</button><button class="btn" onclick="start('reading','week:${selectedWeek}')">本周读题训练</button><button class="btn" onclick="start('card','archive')">历史骨学</button><p class="muted">周五随机检查20词、5条题干；词汇正确率目标90%，否定和方位不能漏。</p></div><div class="panel"><h2>后续复习安排</h2>${STUDY_PLAN.map(x=>`<p><b>第${x.week}周 ${esc(x.dates)}</b> · ${esc(x.focus)}</p>`).join('')}<p class="muted">按原定两个月滚动安排；正式考试日期明确后再调整最后复习段。</p></div>`}
function candidates(f,type){let a=(f==='archive'?records().filter(archived):all()).filter(x=>type==='reading'?x.type==='phrase':x.type==='term');
 if(f.startsWith('week:')){const parts=f.split(':'),w=Number(parts[1]);a=a.filter(x=>x.week===w);if(parts[2]==='day')a=a.filter(x=>x.day===Number(parts[3]))}
 if(f.startsWith('day:')){const d=Number(f.split(':')[1]);a=a.filter(x=>x.week===1&&x.day===d)}
 if(f==='due')a=a.filter(x=>!state.progress[x.id]||state.progress[x.id].next<=Date.now());
 if(f==='today'){const today=localDate();a=a.filter(x=>{const p=state.progress[x.id];return p?p.next<=Date.now():x.date?x.date<=today:x.week===1});}
 if(f==='wrong')a=a.filter(x=>state.progress[x.id]?.wrong&&state.progress[x.id].streak<3);
 return shuffle(a)}
function resetQuestion(){revealed=false;selected=null;options=[]}
function start(m,f){initialized=true;mode=m;filter=f;queue=candidates(f,m);idx=0;resetQuestion();tab=m==='quiz'?'quiz':m==='reading'?'reading':'card';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function action(ok){const x=queue[idx];if(!x)return;score(x.id,ok);idx++;resetQuestion();render()}
function question(){if(!queue.length)return `<div class="panel"><h2>当前没有符合条件的题目</h2><p>今天没有到期题，或当前筛选下没有这种题型。</p><button class="btn" onclick="start('${mode}','week:${selectedWeek}')">练习所选周</button></div>`;
 if(idx>=queue.length)return `<div class="panel"><h2>本轮完成</h2><p>本轮已练习 ${queue.length} 条，记录已保存。</p><button class="btn primary" onclick="start('${mode}','${filter}')">再练一轮</button><button class="btn" onclick="nav('home')">返回首页</button></div>`;
 const x=queue[idx];let html=`<div class="panel"><div class="flex space"><span class="pill">${esc(x.category)} · 第 ${x.week} 周${archived(x)?' · 历史骨学':''}</span><span class="muted tiny">${idx+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0"><div style="width:${idx/queue.length*100}%"></div></div><div class="muted">${mode==='quiz'?'选择最准确的中文意思':'先说出中文，再查看答案'}</div><div class="term">${esc(x.en)}</div>`;
 if(mode==='quiz'){if(!options.length){const pool=(archived(x)?records():all()).filter(y=>y.type==='term'&&y.id!==x.id&&y.zh!==x.zh),unique=[...new Map(shuffle(pool).map(y=>[y.zh,y])).values()];options=shuffle([x,...unique.slice(0,3)])}
 html+=options.map(y=>`<button class="option ${revealed?(y.id===x.id?'good':selected===y.id?'bad':''):''}" ${revealed?'disabled':''} onclick="choose('${esc(y.id)}')">${esc(y.zh)}</button>`).join('');if(revealed)html+=`<div class="notice">正确答案：${esc(x.zh)}<br>${esc(x.note)}</div><button class="btn primary" onclick="nextQuiz()">下一题</button>`;
 }else if(revealed)html+=`<div class="answer">${esc(x.zh)}</div><p class="muted">${esc(x.note)}</p><button class="btn" onclick="action(false)">没记住 · 再复习</button><button class="btn primary" onclick="action(true)">记住了 · 下一题</button>`;
 else html+=`<button class="btn primary" onclick="revealed=true;render()">显示中文答案</button><button class="btn" onclick="action(false)">不会，直接跳过</button>`;
 return html+'</div><div class="muted tiny">只练英译中；题干要核对否定、方位、关系与限定条件。</div>'}
function choose(id){if(revealed)return;selected=id;revealed=true;score(queue[idx].id,id===queue[idx].id);render()}
function nextQuiz(){if(!revealed)return;idx++;resetQuestion();render()}
function controls(m){const opts=[['all','当前范围全部'],['today','今天的新词与复习'],['due','全部待复习'],['wrong','当前范围错题']];for(const w of weeks()){opts.push([`week:${w}`,`第${w}周全部`]);for(const d of meta(w).days)opts.push([`week:${w}:day:${d.day}`,`第${w}周 ${d.date||'第'+d.day+'天'} ${d.title}`])}opts.push(['archive','历史骨学']);return `<div class="panel"><div class="flex space"><h2>${m==='quiz'?'术语选择自测':m==='reading'?'英文题干理解':'英文认词卡片'}</h2><select aria-label="筛选训练内容" onchange="start('${m}',this.value)">${opts.map(([v,t])=>`<option value="${esc(v)}" ${filter===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>`}
function review(){const weak=all().filter(x=>state.progress[x.id]?.wrong&&state.progress[x.id].streak<3).sort((a,b)=>state.progress[b.id].wrong-state.progress[a.id].wrong);return `${summary()}<div class="panel" style="margin-top:15px"><h2>错题与薄弱项</h2><p class="muted">按累计错误次数排序，连续答对3次后移出；记录保留。旧骨学记录可在历史入口继续查看。</p><button class="btn primary" onclick="start('card','wrong')">复习薄弱词汇</button><button class="btn" onclick="start('reading','wrong')">复习薄弱题干</button>${weak.map(x=>`<div style="border-bottom:1px solid #304058;padding:10px 0"><b>${esc(x.en)}</b><div class="muted">${esc(x.zh)} · 累计错${state.progress[x.id].wrong}次 · 连对${state.progress[x.id].streak}次</div></div>`).join('')}</div>`}
function download(name,content){const b=new Blob([content],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBackup(){download('系解学习记录备份.json',JSON.stringify({format:'anatomy-study-backup-v1',...state},null,2))}
function exportTemplate(){download('每周题库导入模板.json',JSON.stringify({week:3,items:[{en:'example term',zh:'示例中文',category:'新周术语',note:'记忆提示',day:1,type:'term'}]},null,2))}
async function importFile(el,backup){const f=el.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());
 if(backup){if(obj.format!=='anatomy-study-backup-v1'||!Array.isArray(obj.extra)||!obj.progress||!Array.isArray(obj.logs))throw Error('不是有效的学习记录备份');state={extra:obj.extra,progress:obj.progress,logs:obj.logs,weekMeta:obj.weekMeta||{}};selectedWeek=Math.max(...weeks());save();alert('学习记录恢复成功');render();return}
 const rows=Array.isArray(obj)?obj:obj.items,week=Number(obj.week||2);if(!Array.isArray(rows)||!rows.length)throw Error('未找到 items 数组');let count=0;
 for(let i=0;i<rows.length;i++){const r=rows[i];if(typeof r.en!=='string'||typeof r.zh!=='string'||!r.en.trim()||!r.zh.trim())continue;const id=r.id||`w${r.week||week}-${r.en.toLowerCase().trim().replace(/\s+/g,'-')}`;if(records().some(x=>x.id===id)||all().some(x=>x.en.toLowerCase().trim()===r.en.toLowerCase().trim()))continue;const w=Number(r.week||week),d=Number(r.day||1);if(!Number.isInteger(w)||w<1||!Number.isInteger(d)||d<1||d>8)continue;state.extra.push({id,week:w,day:d,date:r.date||'',category:r.category||`第${w}周`,en:r.en,zh:r.zh,note:r.note||'',type:r.type==='phrase'?'phrase':'term',...(r.examScope===false?{examScope:false}:{})});count++}
 if(!Array.isArray(obj)&&Array.isArray(obj.days))state.weekMeta[week]={week,title:obj.title||`第${week}周`,startDate:obj.startDate||'',endDate:obj.endDate||'',days:obj.days};save();selectedWeek=Math.max(...weeks());alert(`成功新增 ${count} 条；已有词条与学习记录保留`);render();
 }catch(e){alert('导入失败：'+e.message)}finally{el.value=''}}
function data(){const history=records().filter(archived);return `<div class="panel"><h2>本周题库已内置</h2><p>第2周 2026年11月7日至13日：84个术语、14条读题句型，打开网站即可练习。</p><button class="btn" onclick="download('英文词库第2周_1107至1113.json',JSON.stringify(WEEK2,null,2))">下载本周题库</button><p class="muted">重复导入相同题库会跳过重复项，学习记录保留。</p></div><div class="panel"><h2>后续每周更新</h2><button class="btn" onclick="exportTemplate()">下载题库模板</button><p><input aria-label="导入每周题库" type="file" accept=".json,application/json" onchange="importFile(this,false)"></p></div><div class="panel"><h2>学习数据备份</h2><p class="muted">记录保存在当前浏览器，更换设备前请导出；恢复备份会替换本机学习记录。</p><button class="btn primary" onclick="exportBackup()">导出完整备份</button><p><input aria-label="恢复学习记录备份" type="file" accept=".json,application/json" onchange="importFile(this,true)"></p></div><div class="panel"><h2>题库范围</h2><p>当前范围 ${all().length} 条；历史骨学 ${history.length} 条；浏览器额外导入 ${state.extra.length} 条。</p><p class="muted">原记录按原ID保留，范围调整不会清除进度。</p></div>`}
function render(){if(tab==='home')$('view').innerHTML=home();else if(tab==='review')$('view').innerHTML=review();else if(tab==='data')$('view').innerHTML=data();else{if(mode!==tab||!initialized){initialized=true;mode=tab;queue=candidates('all',mode);idx=0;resetQuestion();filter='all'}$('view').innerHTML=controls(mode)+question()}}
nav('home');

</script></body></html>
